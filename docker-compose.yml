services:
  pg:
    image: postgres:16
    environment:
      POSTGRES_DB: studs
      POSTGRES_USER: studs
      POSTGRES_PASSWORD: studs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studs -d studs"]
      interval: 2s
      timeout: 5s
      retries: 30

  wildfly:
    build: .
    depends_on:
      pg:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./build/libs/lab1.war:/opt/jboss/wildfly/standalone/deployments/lab1.war
