<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Операции</title>
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
<header class="top">
    <a class="brand" href="index.html">Драконы</a>
    <nav>
        <a href="index.html">Список</a>
        <a href="create.html">Создать</a>
        <a class="is-active" href="special.html">Операции</a>
    </nav>
</header>
<main class="wrap stack">
    <div class="ops">
        <section class="card">
            <h1>Поиск</h1>
            <p id="error" class="message"></p>
            <div class="stack">
                <section>
                    <h2>Самая поздняя дата создания</h2>
                    <button type="button" id="max-date">Найти</button>
                </section>
                <section>
                    <h2>Имя содержит подстроку</h2>
                    <form id="by-name" class="row">
                        <label>Подстрока
                            <input id="part" type="text" required>
                        </label>
                        <button type="submit">Найти</button>
                    </form>
                </section>
                <section>
                    <h2>Характер меньше заданного</h2>
                    <p class="hint">Порядок: Мудрый, Добрый, Хаотичный, Непостоянный.</p>
                    <form id="by-character" class="row">
                        <label>Характер
                            <select id="character" required></select>
                        </label>
                        <button type="submit">Найти</button>
                    </form>
                </section>
            </div>
        </section>
        <section class="card result-card">
            <h2 id="result-title">Результат</h2>
            <div id="result"><p class="hint">Найденные драконы появятся здесь.</p></div>
        </section>
    </div>
    <section class="card">
        <h1>Команды</h1>
        <div class="stack">
            <section>
                <h2>Новый убийца</h2>
                <form id="killer-form" class="grid">
                    <label>Имя
                        <input id="killer-name" type="text" maxlength="255" required>
                    </label>
                    <label>Цвет глаз
                        <select id="killer-eye" required></select>
                    </label>
                    <label>Цвет волос
                        <select id="killer-hair"></select>
                    </label>
                    <label>Страна
                        <select id="killer-country"></select>
                    </label>
                    <label>День рождения
                        <input id="killer-birthday" type="datetime-local">
                    </label>
                    <label class="span-2">Место
                        <select id="killer-location"></select>
                    </label>
                    <label>Место X
                        <input id="killer-x" type="number" step="any" required>
                    </label>
                    <label>Место Y
                        <input id="killer-y" type="number" step="any" required>
                    </label>
                    <label>Место Z
                        <input id="killer-z" type="number" step="any" required>
                    </label>
                    <label>Название места
                        <input id="killer-place" type="text" maxlength="321">
                    </label>
                    <button type="submit">Сохранить убийцу</button>
                </form>
                <div id="killer-result"></div>
            </section>
            <section>
                <h2>Новая команда убийц</h2>
                <form id="team-form" class="grid">
                    <label class="span-2">Имя команды
                        <input id="team-name" type="text" maxlength="255" required>
                    </label>
                    <div class="span-2">
                        <p class="hint">Убийцы</p>
                        <div id="members" class="checks"></div>
                    </div>
                    <button type="submit">Сохранить в базе</button>
                </form>
            </section>
            <section>
                <h2>Отправить команду в пещеру</h2>
                <form id="send-form" class="row">
                    <label>Команда
                        <select id="team-id" required></select>
                    </label>
                    <label>Пещера
                        <select id="cave-id" required></select>
                    </label>
                    <button type="submit">Отправить</button>
                </form>
                <div id="team-result"></div>
                <div id="teams"></div>
            </section>
        </div>
    </section>
</main>
<script src="js/common.js?v=4"></script>
<script src="js/special.js?v=4"></script>
</body>
</html>
