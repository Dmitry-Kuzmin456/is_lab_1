<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Драконы</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
    <a class="brand" href="index.html">Драконы</a>
    <nav>
        <a class="is-active" href="index.html">Список</a>
        <a href="create.html">Создать</a>
        <a href="special.html">Операции</a>
    </nav>
</header>
<main class="wrap">
    <section class="card">
        <h1>Список</h1>
        <p id="error" class="message"></p>
        <form id="filters" class="filters">
            <label>Колонка
                <select id="field">
                    <option value="">Без фильтра</option>
                    <option value="name">Имя</option>
                    <option value="character">Характер</option>
                    <option value="killerName">Убийца</option>
                    <option value="eyeColor">Глаза</option>
                    <option value="hairColor">Волосы</option>
                    <option value="nationality">Страна</option>
                    <option value="locationName">Название места</option>
                </select>
            </label>
            <label>Подстрока
                <input id="q" type="text" placeholder="как в таблице">
            </label>
            <label>Сортировка
                <select id="sort">
                    <option value="">По номеру</option>
                    <option value="name">Имя</option>
                    <option value="character">Характер</option>
                    <option value="killerName">Убийца</option>
                    <option value="eyeColor">Глаза</option>
                    <option value="hairColor">Волосы</option>
                    <option value="nationality">Страна</option>
                    <option value="locationName">Название места</option>
                </select>
            </label>
            <label>Порядок
                <select id="dir">
                    <option value="asc">По возрастанию</option>
                    <option value="desc">По убыванию</option>
                </select>
            </label>
            <button type="submit">Показать</button>
        </form>
        <div id="table"></div>
        <div id="pager" class="pager"></div>
    </section>
</main>
<script src="js/common.js"></script>
<script src="js/list.js"></script>
</body>
</html>
